name: PatriaSoul · Provjera aplikacije

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi repozitorij
        uses: actions/checkout@v4
      - name: Postavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instaliraj ovisnosti
        run: npm install --no-audit --no-fund
      - name: Provjeri sintaksu dnevne liturgije
        run: node --check public/vjera-hrvata.js
      - name: Provjeri produkcijsku izgradnju
        run: npm run build
      - name: Pokreni lokalni pregled izgrađene aplikacije
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/cuvari-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap "kill $PREVIEW_PID 2>/dev/null || true" EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke-routes.mjs
  deploy:
    name: Objavi na Cloudflare Workers
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi repozitorij
        uses: actions/checkout@v4
      - name: Postavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instaliraj ovisnosti
        run: npm install --no-audit --no-fund
      - name: Izgradi aplikaciju
        run: npm run build
      - name: Objavi Worker i statičke datoteke
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Nedostaju GitHub Actions secrets CLOUDFLARE_API_TOKEN i/ili CLOUDFLARE_ACCOUNT_ID. Dodaj ih u Settings > Secrets and variables > Actions."
            exit 1
          fi
          npx --yes wrangler@4 deploy --config wrangler.jsonc
