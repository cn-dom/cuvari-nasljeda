name: PatriaSoul · Provjera aplikacije

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi repozitorij
        uses: actions/checkout@v4
      - name: Postavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instaliraj ovisnosti
        run: npm install --no-audit --no-fund
      - name: Provjeri sintaksu javnih skripti
        run: |
          node --check public/vjera-hrvata.js
          node --check public/na-danasnji-dan.js
      - name: Provjeri produkcijsku izgradnju
        run: npm run build
      - name: Instaliraj Chromium za testove u pregledniku
        run: npx playwright install --with-deps chromium
      - name: Pokreni lokalni pregled izgrađene aplikacije
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/cuvari-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap "kill $PREVIEW_PID 2>/dev/null || true" EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke-routes.mjs
          npm run test:browser
  deploy:
    name: Objavi na Cloudflare Workers
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi repozitorij
        uses: actions/checkout@v4
      - name: Postavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instaliraj ovisnosti
        run: npm install --no-audit --no-fund
      - name: Provjeri ciljani Supabase projekt i API ključ
        env:
          VITE_SUPABASE_URL: https://azerctpwfzdivydsxyex.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Nedostaje VITE_SUPABASE_PUBLISHABLE_KEY u GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi
          node --input-type=module <<'NODE'
          const expectedProject = "azerctpwfzdivydsxyex";
          const url = new URL(process.env.VITE_SUPABASE_URL);
          const actualProject = url.hostname.split(".")[0];
          console.log(`Ciljani Supabase projekt: ${actualProject}`);
          if (actualProject !== expectedProject) {
            console.error(`::error::Pogrešan Supabase projekt. Očekivano: ${expectedProject}; dobiveno: ${actualProject}`);
            process.exit(1);
          }
          const response = await fetch(`${url.origin}/auth/v1/settings`, {
            headers: { apikey: process.env.VITE_SUPABASE_PUBLISHABLE_KEY }
          });
          if (!response.ok) {
            console.error("::error::Publishable key nije prihvaćen od ciljanog Supabase projekta. Aplikacija nije objavljena.");
            process.exit(1);
          }
          console.log("Supabase API ključ potvrđen za ciljani projekt.");
          NODE
      - name: Izgradi aplikaciju za potvrđeni Supabase projekt
        env:
          VITE_SUPABASE_URL: https://azerctpwfzdivydsxyex.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Postavi YouTube API ključ u Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Nedostaju GitHub Actions secrets CLOUDFLARE_API_TOKEN i/ili CLOUDFLARE_ACCOUNT_ID. Dodaj ih u Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::error::Nedostaje GitHub Actions secret YOUTUBE_API_KEY. Dodaj ga u Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s' "$YOUTUBE_API_KEY" | npx --yes wrangler@4 secret put YOUTUBE_API_KEY --config wrangler.jsonc
      - name: Objavi Worker i statičke datoteke
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Nedostaju GitHub Actions secrets CLOUDFLARE_API_TOKEN i/ili CLOUDFLARE_ACCOUNT_ID. Dodaj ih u Settings > Secrets and variables > Actions."
            exit 1
          fi
          npx --yes wrangler@4 deploy --config wrangler.jsonc
