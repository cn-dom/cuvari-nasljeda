name: PatriaSoul · Provjera aplikacije

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi repozitorij
        uses: actions/checkout@v4
      - name: Postavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instaliraj ovisnosti
        run: npm install --no-audit --no-fund
      - name: Provjeri produkcijsku izgradnju
        run: npm run build