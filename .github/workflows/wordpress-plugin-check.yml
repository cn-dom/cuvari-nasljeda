name: PatriaSoul WordPress plugin and theme check

on:
  pull_request:
    paths:
      - "wordpress/**"
      - ".github/workflows/wordpress-plugin-check.yml"
  push:
    branches:
      - "wordpress/migration-foundation"
    paths:
      - "wordpress/**"
      - ".github/workflows/wordpress-plugin-check.yml"

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP syntax and package structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - name: Check PHP syntax in plugin and child theme
        run: find wordpress -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Check required package files
        run: |
          test -s wordpress/patriasoul-core/patriasoul-core.php
          test -s wordpress/patriasoul-core/assets/patriasoul-core.css
          test -s wordpress/blocksy-patriasoul-child/style.css
          test -s wordpress/blocksy-patriasoul-child/functions.php
          test -s wordpress/README.md
      - name: Check plugin safeguards and child theme identity
        shell: bash
        run: |
          set -euo pipefail
          plugin='wordpress/patriasoul-core/patriasoul-core.php'
          theme='wordpress/blocksy-patriasoul-child/style.css'
          functions='wordpress/blocksy-patriasoul-child/functions.php'
          guide='wordpress/blocksy-patriasoul-child/README.md'
          grep -q "Plugin Name: PatriaSoul" "$plugin"
          grep -q "if (!defined('ABSPATH'))" "$plugin"
          grep -q "wp_verify_nonce" "$plugin"
          grep -q "current_user_can('edit_post'" "$plugin"
          grep -q "patriasoul_portal" "$plugin"
          grep -q "patriasoul_museum" "$plugin"
          grep -q "patriasoul_memorials" "$plugin"
          grep -q "patriasoul_footer" "$plugin"
          grep -q "Hrvatska · povijest · znanje · identitet" "$plugin"
          grep -q "Znanje · Ponos · Nasljeđe" "$plugin"
          grep -q "Theme Name: Blocksy Child" "$theme"
          grep -q "Template: blocksy" "$theme"
          grep -q "add_theme_support('custom-logo'" "$functions"
          grep -q "Hrvatska · povijest · znanje · identitet" "$guide"
          grep -q "Znanje · Ponos · Nasljeđe" "$guide"
          echo 'Static checks passed; this does not replace testing inside WordPress.'
