<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#172c46" />
    <meta name="description" content="PatriaSoul – Čuvari nasljeđa. Društvena mreža hrvatskog zajedništva." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PatriaSoul" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/assets/images/1000000982.png" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/images/1000000982.png" />
    <title>PatriaSoul – Čuvari nasljeđa</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", async () => {
          try {
            await navigator.serviceWorker.register("/sw.js", { scope: "/" });
          } catch (error) {
            console.warn("PatriaSoul PWA:", error);
          }
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
